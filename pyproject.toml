[project]
name = "camovox"
version = "0.1.0"
description = "Cable morphologies from voxels"
readme = "README.md"
authors = [{ name = "Jordan M. R. Fox", email = "jfox@sdsu.edu" }]
requires-python = ">=3.12"
dependencies = [
    "jaxley>=0.14,<0.15",
    "matplotlib>=3.11.2",
    "numpy",
    "pytetwild>=0.4.2",
    "pyvista>=0.49.1",
    "scikit-fem>=12.0.2",
    "scipy>=1.18.1",
    "trimesh>=5.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ipykernel",
    "jupytext",
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["slow: long-running tests (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D", "E402"]

[tool.jupytext]
formats = "ipynb,py:percent"
